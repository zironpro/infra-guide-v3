<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Dark Black Gradient -->
    <linearGradient id="blackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C211E"/>
      <stop offset="45%" stop-color="#0B0F0C"/>
      <stop offset="100%" stop-color="#020403"/>
    </linearGradient>

    <!-- Metallic Gold Gradient for Letter P -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B8"/>
      <stop offset="25%" stop-color="#F2D675"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8F7A2C"/>
    </linearGradient>

    <!-- Golden Border Subtle Accent -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D675" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8F7A2C" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Golden Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Black Gradient Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#blackBg)"/>
  
  <!-- Subtle Outer Gold Border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>

  <!-- Golden Serif Letter P -->
  <g filter="url(#goldGlow)">
    <path d="M 148 110 
             H 285 
             C 362 110, 412 150, 412 225 
             C 412 300, 362 340, 285 340 
             H 230 
             V 398 
             C 230 406, 236 412, 244 412 
             H 260 
             V 430 
             H 130 
             V 412 
             H 146 
             C 154 412, 160 406, 160 398 
             V 142 
             C 160 134, 154 128, 146 128 
             H 130 
             V 110 
             Z 
             M 230 168 
             V 282 
             H 280 
             C 322 282, 348 258, 348 225 
             C 348 192, 322 168, 280 168 
             Z" 
          fill="url(#goldGradient)"/>
  </g>
</svg>
