<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8D36A"/>
      <stop offset="50%" stop-color="#C7A42C"/>
      <stop offset="100%" stop-color="#8A6B12"/>
    </linearGradient>
  </defs>

  <!-- Large P -->
  <text
    x="20"
    y="200"
    font-size="200"
